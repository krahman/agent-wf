# Eval cases: each runs the agent against a real model; `uv run pytest -m eval` (see AGENTS.md).
# Checks are plain assertions on the tools called and the final answer; see tests/evals/harness.py.
# Numbers in answers are checked with `answer_number`, which compares values, so 3500 / 3,500 / 3.500 and
# 6.25 / 6,25 all match while 2 never matches inside 12 or 20. The model also answers in the prompt's
# language and may spell a number out: list those as `words` (whole words) and rule out compounds with
# `answer_excludes` ("dua" is inside "dua belas"). `unordered: true` on `tool_args` is for commutative
# operations, where the numbers may come in any order; leave it off where order matters (subtract, divide).

- id: add-basic
  prompt: What is 17 plus 25?
  tags: [add]
  checks:
    expect_tools: [add_numbers]
    forbid_tools: [search_wikipedia]
    tool_args:
      - tool: add_numbers
        args: {numbers: [17, 25]}
        unordered: true
    answer_number:
      - value: 42
    max_tool_calls: 2

- id: add-indonesian
  prompt: satu ditambah satu
  tags: [add, non_english]
  checks:
    expect_tools: [add_numbers]
    tool_args:
      - tool: add_numbers
        args: {numbers: [1, 1]}
        unordered: true
    answer_number:
      - value: 2
        words: [dua]
    answer_excludes: [belas, puluh, ratus, ribu]

- id: multiply-indonesian
  prompt: Berapa tiga kali empat?
  tags: [multiply, non_english]
  checks:
    expect_tools: [multiply_numbers]
    tool_args:
      - tool: multiply_numbers
        args: {numbers: [3, 4]}
        unordered: true
    answer_number:
      - value: 12
        words: [dua belas]

- id: subtract-argument-order
  prompt: What is 10 minus 3?
  tags: [subtract, argument_order]
  checks:
    expect_tools: [subtract_numbers]
    tool_args:
      - tool: subtract_numbers
        args: {numbers: [10, 3]}
    answer_number:
      - value: 7

- id: subtract-chain
  prompt: Start with 100, then subtract 20, then subtract 10.
  tags: [subtract, argument_order]
  checks:
    expect_tools: [subtract_numbers]
    tool_args:
      - tool: subtract_numbers
        args: {numbers: [100, 20, 10]}
    answer_number:
      - value: 70

- id: multiply-basic
  prompt: Multiply 6 by 7.
  tags: [multiply]
  checks:
    expect_tools: [multiply_numbers]
    tool_args:
      - tool: multiply_numbers
        args: {numbers: [6, 7]}
        unordered: true
    answer_number:
      - value: 42

- id: divide-argument-order
  prompt: What is 25 divided by 4?
  tags: [divide, argument_order]
  checks:
    expect_tools: [divide_numbers]
    tool_args:
      - tool: divide_numbers
        args: {numbers: [25, 4]}
    answer_number:
      - value: 6.25

- id: power-basic
  prompt: What is 2 to the power of 10?
  tags: [power]
  checks:
    expect_tools: [power_tool]
    tool_args:
      - tool: power_tool
        args: {base: 2, exponent: 10}
    answer_number:
      - value: 1024

- id: multi-step
  prompt: Compute (2 + 3) * 4.
  tags: [multi_step, add, multiply]
  checks:
    expect_tools: [add_numbers, multiply_numbers]
    tool_args:
      - tool: add_numbers
        args: {numbers: [2, 3]}
        unordered: true
      - tool: multiply_numbers
        args: {numbers: [5, 4]}
        unordered: true
    answer_number:
      - value: 20

- id: thousands-separators
  prompt: What is 1,000 plus 2,500?
  tags: [add, separators]
  checks:
    expect_tools: [add_numbers]
    tool_args:
      - tool: add_numbers
        args: {numbers: [1000, 2500]}
        unordered: true
    answer_number:
      - value: 3500

- id: negative-numbers
  prompt: What is -5 plus 3?
  tags: [add, negative]
  checks:
    expect_tools: [add_numbers]
    tool_args:
      - tool: add_numbers
        args: {numbers: [-5, 3]}
        unordered: true
    answer_number:
      - value: -2
        words: [negative 2, minus 2]

# Dividing by zero is checked two ways. Left to itself, the model never sends a zero divisor to the
# calculator: asked directly, or after computing 5 - 5, it answers from knowledge (observed with
# gpt-4o), so the direct case only checks that it never invents a number. The tool-path case names the
# tool, which is the only way to exercise "if a tool returns an error, report it instead of guessing".
- id: divide-by-zero-direct
  prompt: What is 10 divided by 0?
  tags: [divide, divide_by_zero]
  checks:
    answer_contains_any: ["zero", "cannot", "can't", "not possible", "impossible", "undefined"]
    answer_excludes: ["infinity", "∞"]

- id: divide-by-zero-reports-the-error
  prompt: Use the divide tool to divide 100 by 0, and tell me exactly what the tool returned.
  tags: [divide, divide_by_zero]
  checks:
    expect_tools: [divide_numbers]
    tool_args:
      - tool: divide_numbers
        args: {numbers: [100, 0]}
    answer_contains_any: ["cannot divide by zero", "can't divide by zero", "division by zero", "divide by zero"]
    answer_excludes: ["infinity", "∞"]

- id: large-calculation-uses-a-tool
  prompt: "Quick question, no need to be exact: what is 123456 times 654321?"
  tags: [multiply, no_guess]
  checks:
    expect_tools: [multiply_numbers]
    tool_args:
      - tool: multiply_numbers
        args: {numbers: [123456, 654321]}
        unordered: true
    answer_number:
      - value: 80779853376

- id: lookup-then-calculate
  prompt: How tall is the Eiffel Tower in metres, and what is that height multiplied by 2?
  tags: [lookup, multiply]
  checks:
    expect_tools: [search_wikipedia, multiply_numbers]
    answer_number:
      - value: 660
