[project]
name = "agent-wf"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-openai==1.6.6",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "langfuse>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml",
    "ruff",
    "ipykernel",
    "notebook",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = [
    "eval: runs the agent against a real model (opt-in: pytest -m eval)",
    "quick: the 3-case eval subset (pytest -m \"eval and quick\")",
]
filterwarnings = [
    # langsmith (pulled in by langchain-core) still calls asyncio.iscoroutinefunction, deprecated in
    # Python 3.14 and removed in 3.16. Only this message from this module is hidden; remove the filter
    # once a langsmith release stops using it.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith._internal._beta_decorator",
]

[tool.ruff]
extend-exclude = ["examples"]
