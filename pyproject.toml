[project]
name = "agent-wf"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = [
    "ipykernel",
    "notebook",
    "pip",
    "langchain>=1.0",
    "langchain-ibm==1.1.1",
    "langchain-community==0.4.2",
    "wikipedia==1.4.0",
    "langchain-openai==1.6.6",
    "fastapi[standard]>=0.162.0",
    "uvicorn>=0.54.0",
    "openai>=3.46.0",
    "openrouter>=1.3.137",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wf"]
