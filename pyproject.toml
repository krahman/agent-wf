[project]
name = "agent-wf"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-community==0.4.2",
    "wikipedia==1.4.0",
    "langchain-openai==1.6.6",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.0",
    "langfuse>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "ipykernel",
    "notebook",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
