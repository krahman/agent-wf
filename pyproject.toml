[project]
name = "agent-wf"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0",
    "langchain-openai==1.6.6",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "langfuse>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml",
    "ruff",
    "ipykernel",
    "notebook",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not eval'"
markers = ["eval: runs the agent against a real model (opt-in: pytest -m eval)"]

[tool.ruff]
extend-exclude = ["examples"]
